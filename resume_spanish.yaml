# Configuración visual detallada basada en la documentación (Páginas 15-16)
design:
  theme: moderncv
  page:
    size: us-letter
    top_margin: 2cm
    bottom_margin: 2cm
    left_margin: 2cm
    right_margin: 2cm
    show_footer: true
    show_top_note: false
  colors:
    name: "#004f90"
    section_titles: "#004f90"
    links: "#004f90"
  typography:
    font_size:
      name: 25pt
    bold:
      section_titles: true
  header:
    alignment: left
  section_titles:
    type: with_partial_line

# Configuración de idioma para que las fechas salgan en Español (Página 17)
locale:
  language: spanish
  present: Presente

# Ajustes generales de RenderCV (Página 18)
settings:
  render_command:
    output_folder: cv_output
    pdf_path: OUTPUT_FOLDER/resume-spanish-rendercv.pdf
  bold_keywords:
    - React
    - React Native
    - JavaScript
    - Nodejs
    - Docker
    - Git
    - MongoDB
    - PostgreSQL
    - AWS
    - GCP
    - CI/CD